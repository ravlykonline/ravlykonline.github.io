name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run unit tests
        run: npm run test:unit

      - name: Run published project tests
        run: npm run test:projects

      - name: Check HTML partials are in sync
        run: npm run html:check-partials

      - name: Check generated precache manifest
        run: npm run precache:check

      - name: Lint — security and bug-catching checks
        run: npm run lint

      - name: Run end-to-end tests
        run: npm run test:e2e -- --reporter=dot
