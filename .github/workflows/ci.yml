name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The release-token guard diffs against the base ref.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check release token contract
        env:
          RELEASE_TOKEN_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run release:check-token

      - name: Run unit tests
        run: npm run test:unit

      - name: Run published project tests
        run: npm run test:projects

      - name: Check HTML partials are in sync
        run: npm run html:check-partials

      - name: Check generated precache manifest
        run: npm run precache:check

      - name: Check documentation contracts
        run: npm run docs:check

      - name: Lint — security and bug-catching checks
        run: npm run lint

      - name: Run end-to-end tests
        run: npm run test:e2e -- --reporter=dot
