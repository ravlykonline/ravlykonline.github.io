<button id="accessibility-toggle" class="accessibility-toggle" aria-expanded="false"
  aria-controls="accessibility-panel" aria-label="Налаштування доступності"><span class="ui-icon icon-universal-access" aria-hidden="true"></span></button>
<div id="accessibility-panel" class="accessibility-panel hidden" role="dialog" aria-modal="true"
  aria-labelledby="accessibility-title">
    <div class="accessibility-header">
      <h3 id="accessibility-title" class="accessibility-panel-title">Налаштування доступності</h3>
      <button id="close-accessibility-panel-btn" class="close-btn"
        aria-label="Закрити панель налаштувань доступності">&times;</button>
    </div>
    <div class="accessibility-options">
      <div class="accessibility-option">
        <label for="high-contrast-input">Високий контраст</label>
        <div class="toggle-switch">
          <input type="checkbox" id="high-contrast-input" class="accessibility-setting-input"
            data-setting="high-contrast">
          <span class="toggle-slider"></span>
        </div>
      </div>
      <div class="accessibility-option">
        <label for="larger-text-input">Збільшений текст</label>
        <div class="toggle-switch">
          <input type="checkbox" id="larger-text-input" class="accessibility-setting-input" data-setting="larger-text">
          <span class="toggle-slider"></span>
        </div>
      </div>
      <div class="accessibility-option">
        <label for="reduce-animations-input">Зменшення анімації</label>
        <div class="toggle-switch">
          <input type="checkbox" id="reduce-animations-input" class="accessibility-setting-input"
            data-setting="reduce-animations">
          <span class="toggle-slider"></span>
        </div>
      </div>
      <div class="accessibility-option">
        <label for="sans-serif-font-input">Простий шрифт</label>
        <div class="toggle-switch">
          <input type="checkbox" id="sans-serif-font-input" class="accessibility-setting-input"
            data-setting="sans-serif-font">
          <span class="toggle-slider"></span>
        </div>
      </div>
      <div class="accessibility-option">
        <label for="increased-spacing-input">Збільшені інтервали</label>
        <div class="toggle-switch">
          <input type="checkbox" id="increased-spacing-input" class="accessibility-setting-input"
            data-setting="increased-spacing">
          <span class="toggle-slider"></span>
        </div>
      </div>
    </div>
    <div class="accessibility-footer">
      <button id="reset-accessibility-btn" class="btn btn-danger">Скинути налаштування</button>
    </div>
</div>
