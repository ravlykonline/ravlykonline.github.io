<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Пригоди Равлика</title>
<meta name="theme-color" content="#f6e7c6">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none';">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="ravlyk.png" sizes="any">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<a class="skip-link" href="#main-content">Перейти до поля гри</a>
<main class="grid-area" id="main-content" tabindex="-1" aria-label="Ігрове поле 8 на 6">
  <header class="level-bar" aria-label="Поточний рівень">
    <div class="level-meta">
      <span class="game-name">Пригоди Равлика</span>
      <h1 class="level-title" id="level-title">Пряма доріжка</h1>
    </div>
    <div class="level-controls">
      <button class="theme-btn" id="btn-theme" type="button" aria-label="Увімкнути нічний режим" title="Увімкнути нічний режим">
        <span class="ui-icon theme-icon" data-icon="moon" aria-hidden="true"></span>
        <span class="theme-label">Ніч</span>
      </button>
      <button class="map-btn" id="btn-map" type="button" aria-label="Карта рівнів">
        <span class="ui-icon" data-icon="map" aria-hidden="true"></span> Рівні
      </button>
    </div>
    <div class="progress-box">
      <span class="level-chip" id="level-chip" aria-label="Рівень 1 з 20">1 / 20</span>
      <span class="progress-text" id="progress-text">Пройдено 0 з 20 рівнів</span>
      <div class="progress-track" id="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Прогрес проходження">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </header>

  <div class="gwrap" id="gwrap">
    <div id="grid" role="grid" aria-label="Поле 8 на 6. Тут можна ставити команди для маршруту."></div>
    <div id="snail" aria-hidden="true"></div>
  </div>
  <div class="side-panel">
    <div class="route-tools">
      <div id="status" role="status" aria-live="polite" aria-atomic="true">
        <span id="sico" class="ui-icon" data-icon="hint" aria-hidden="true"></span>
        <span id="stxt">Вибери картку зі стрілкою.</span>
      </div>
      <div class="command-tray">
        <div class="palette" id="palette" role="group" aria-label="Стрілки"></div>
        <button class="tool-btn" id="btn-undo" aria-label="Скасувати останню дію" title="Скасувати останню дію" type="button" disabled>
          <span class="ui-icon" data-icon="undo" aria-hidden="true"></span>
        </button>
        <button class="tool-btn" id="btn-clr" aria-label="Очистити поле" title="Очистити поле" type="button">
          <span class="ui-icon" data-icon="trash" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <div class="command-panel">
      <button class="icon-btn btn-run" id="btn-run" aria-label="Запустити алгоритм" type="button">
        <span class="ui-icon" data-icon="play" aria-hidden="true"></span>
        Запустити
      </button>

      <section class="level-toolbar" aria-label="Допомога й навігація">
        <div class="toolbar-actions">
          <button class="info-btn" id="btn-level-info" type="button">Завдання</button>
          <button class="speak-btn" id="btn-speak-task" type="button" aria-label="Озвучити завдання" title="Озвучити завдання">Слухати</button>
        </div>
        <div class="level-nav" aria-label="Навігація рівнями">
          <button class="level-nav-btn" id="btn-prev" type="button" aria-label="Попередній рівень" title="Попередній рівень">
            <span class="ui-icon" data-icon="prev" aria-hidden="true"></span>
            Назад
          </button>
          <button class="level-nav-btn" id="btn-next" type="button" aria-label="Наступний рівень" title="Наступний рівень">
            Далі
            <span class="ui-icon" data-icon="next" aria-hidden="true"></span>
          </button>
        </div>
      </section>
    </div>
  </div>
</main>

<section class="level-card level-intro-source" id="level-intro-content" aria-label="Опис рівня" hidden>
  <div class="level-badges">
    <span class="mode-chip" id="level-mode">Звичайний рівень</span>
    <span class="goal-chip" id="level-goal">Навчитися рухатися праворуч.</span>
  </div>
  <p class="level-hint" id="level-hint">Постав стрілочки праворуч, щоб равлик дійшов до яблука.</p>
  <p class="debug-note" id="debug-note" hidden></p>
</section>

<noscript>
  <section class="level-card" aria-label="Повідомлення без JavaScript">
    <p>Для цієї гри потрібен JavaScript. Увімкніть його, щоб керувати равликом і проходити рівні.</p>
  </section>
</noscript>

<div id="ghost" aria-hidden="true"></div>
<div id="confetti" aria-hidden="true"></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
